<!doctype html>
<!--
  Seamless looping background film (HyperFrames composition).
  render.mjs fills in the shot list (JSON) and composition id, copies the
  images + GSAP next to the generated index.html, and renders it.

  Real photographs, slow camera moves and plain dissolves; nothing synthetic
  is added on top. Loop: the last shot dissolves into a copy of the first
  shot at its starting scale, so the final frame matches frame 0.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>__ID__</title>
    <script src="gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #141210;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141210;
      }
      .shot {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .shot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: contrast(1.06) saturate(0.92) sepia(0.08);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 40%, transparent 50%, rgb(20 18 16 / 0.6));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-width="1920" data-height="1080" data-duration="__DURATION__">
      <div id="shots"></div>
      <div class="vignette"></div>
    </div>
    <script>
      const SHOTS = __SHOTS__;
      const DURATION = __DURATION__;
      const FADE = 1.0;
      const ID = '__ID__';

      const shotsEl = document.getElementById('shots');
      const tl = gsap.timeline({ paused: true });

      // Each shot holds `slot` seconds; neighbours overlap by FADE.
      const slot = DURATION / SHOTS.length;
      const all = [...SHOTS, SHOTS[0]]; // trailing copy of shot 0 closes the loop
      all.forEach((src, i) => {
        const shot = document.createElement('div');
        shot.className = 'shot';
        shot.id = `${ID}-shot-${i}`;
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        shot.appendChild(img);
        shotsEl.appendChild(shot);

        const isLoopCopy = i === SHOTS.length;
        // The loop copy must be fully in a beat before the end.
        const start = i === 0 ? 0 : isLoopCopy ? DURATION - FADE - 0.25 : i * slot - FADE;
        // Alternate push-in direction for a camera-like rhythm.
        const dir = i % 2 ? -1 : 1;
        const fromVars = { scale: 1.0, xPercent: 0, yPercent: 0 };
        const toVars = { scale: 1.14, xPercent: 2.2 * dir, yPercent: -1.2, ease: 'none', duration: slot + FADE };

        if (i === 0) tl.set(shot, { opacity: 1 }, 0);
        else tl.fromTo(shot, { opacity: 0 }, { opacity: 1, duration: FADE, ease: 'power1.inOut' }, start);

        if (isLoopCopy) {
          // Matches frame 0 exactly: hold the starting transform.
          tl.set(img, fromVars, start);
        } else {
          tl.fromTo(img, fromVars, toVars, start);
        }
      });

      window.__timelines[ID] = tl;
    </script>
  </body>
</html>

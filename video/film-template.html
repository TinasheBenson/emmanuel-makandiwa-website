<!doctype html>
<!--
  Seamless looping background film (HyperFrames composition).
  render.mjs fills in the shot list (JSON) and composition id, copies the
  images + GSAP next to the generated index.html, and renders it.

  Loop: the last shot cross-fades into a copy of the first shot at its
  starting scale, and the dust field wraps exactly once, so frame N == frame 0.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>__ID__</title>
    <script src="gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #0d1220;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1220;
      }
      .shot {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .shot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: contrast(1.06) saturate(0.92) sepia(0.08);
      }
      .leak {
        position: absolute;
        width: 1400px;
        height: 1400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 214 140 / 0.55), rgb(200 161 90 / 0.18) 40%, transparent 70%);
        mix-blend-mode: screen;
        opacity: 0;
        top: -160px;
        left: 0;
      }
      #dust {
        position: absolute;
        inset: 0;
      }
      .mote {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 50%;
        background: radial-gradient(circle, #fff3d6, rgb(227 200 143 / 0));
        mix-blend-mode: screen;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 40%, transparent 45%, rgb(13 18 32 / 0.75));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-start="0" data-width="1920" data-height="1080" data-duration="__DURATION__">
      <div id="shots"></div>
      <div id="leaks"></div>
      <div id="dust"></div>
      <div class="vignette"></div>
    </div>
    <script>
      const SHOTS = __SHOTS__;
      const DURATION = __DURATION__;
      const FADE = 1.0;
      const ID = '__ID__';

      // Deterministic PRNG (renders must be reproducible).
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(1987);

      const shotsEl = document.getElementById('shots');
      const leaksEl = document.getElementById('leaks');
      const dustEl = document.getElementById('dust');
      const tl = gsap.timeline({ paused: true });

      // Each shot holds `slot` seconds; neighbours overlap by FADE.
      const slot = DURATION / SHOTS.length;
      const all = [...SHOTS, SHOTS[0]]; // trailing copy of shot 0 closes the loop
      all.forEach((src, i) => {
        const shot = document.createElement('div');
        shot.className = 'shot';
        shot.id = `${ID}-shot-${i}`;
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        shot.appendChild(img);
        shotsEl.appendChild(shot);

        const isLoopCopy = i === SHOTS.length;
        // The loop copy must be fully in (and its leak gone) a beat before the end.
        const start = i === 0 ? 0 : isLoopCopy ? DURATION - FADE - 0.25 : i * slot - FADE;
        // Alternate push-in direction for a camera-like rhythm.
        const dir = i % 2 ? -1 : 1;
        const fromVars = { scale: 1.0, xPercent: 0, yPercent: 0 };
        const toVars = { scale: 1.14, xPercent: 2.2 * dir, yPercent: -1.2, ease: 'none', duration: slot + FADE };

        if (i === 0) tl.set(shot, { opacity: 1 }, 0);
        else tl.fromTo(shot, { opacity: 0 }, { opacity: 1, duration: FADE, ease: 'power1.inOut' }, start);

        if (isLoopCopy) {
          // Matches frame 0 exactly: hold the starting transform.
          tl.set(img, fromVars, start);
        } else {
          tl.fromTo(img, fromVars, toVars, start);
        }

        // A light leak sweeps across every cut.
        if (i > 0) {
          const leak = document.createElement('div');
          leak.className = 'leak';
          leak.id = `${ID}-leak-${i}`;
          leaksEl.appendChild(leak);
          const fromLeft = i % 2 === 1;
          tl.fromTo(
            leak,
            { x: fromLeft ? -1400 : 1920, opacity: 0 },
            { x: fromLeft ? 1920 : -1400, duration: FADE * 2.2, ease: 'power1.inOut' },
            start - FADE * 0.6,
          );
          tl.to(leak, { opacity: 1, duration: FADE * 0.8, ease: 'power1.in' }, start - FADE * 0.6);
          tl.to(leak, { opacity: 0, duration: FADE * 0.5, ease: 'power1.out' }, start + FADE * 0.4);
        }
      });

      // Rising gold dust that wraps once per loop, driven by timeline time.
      const W = 1920;
      const H = 1080;
      const motes = Array.from({ length: 70 }, (_, i) => {
        const el = document.createElement('div');
        el.className = 'mote';
        el.id = `${ID}-mote-${i}`;
        const size = 3 + rand() * 9;
        el.style.width = el.style.height = `${size}px`;
        el.style.opacity = String(0.25 + rand() * 0.6);
        dustEl.appendChild(el);
        return { el, x: rand() * W, y: rand() * (H + 40), sway: 10 + rand() * 30, phase: rand() * Math.PI * 2, laps: 1 + Math.floor(rand() * 2) };
      });
      const clock = { t: 0 };
      const paintDust = () => {
        const p = clock.t / DURATION;
        motes.forEach((m) => {
          const y = (((m.y - p * m.laps * (H + 40)) % (H + 40)) + (H + 40)) % (H + 40) - 20;
          const x = m.x + Math.sin(p * Math.PI * 2 * m.laps + m.phase) * m.sway;
          m.el.style.transform = `translate(${x}px, ${y}px)`;
        });
      };
      paintDust();
      tl.to(clock, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: paintDust }, 0);

      window.__timelines[ID] = tl;
    </script>
  </body>
</html>
